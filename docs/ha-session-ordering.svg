<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" role="img" aria-labelledby="title description">
  <title id="title">A late session response cannot undo revocation</title>
  <desc id="description">Creating a session starts operation 1. Revoking starts operation 2 and clears the credential immediately. The server still receives revocation. When operation 1 finally returns, its generation no longer matches, so its credential and UI update are discarded. Fourteen scenarios have passed locally in Chromium, Firefox and WebKit; hosted qualification is separate.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#365168"/></marker>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#08785f"/></marker>
    <style>text{font-family:system-ui,-apple-system,sans-serif;fill:#163349}.small{font-size:15px}.body{font-size:17px}.label{font-size:18px;font-weight:650}.muted{fill:#526b7e}.rule{stroke:#c6d5df;stroke-width:2;stroke-dasharray:5 6}</style>
  </defs>
  <rect width="1000" height="570" rx="20" fill="#f4f8fb"/>
  <text x="36" y="48" font-size="27" font-weight="700">Revocation wins over a delayed session response</text>
  <text x="36" y="77" class="body muted">Only the latest browser operation may write a credential or change the result.</text>
  <rect x="36" y="102" width="275" height="44" rx="9" fill="#e1ebf2"/>
  <rect x="355" y="102" width="275" height="44" rx="9" fill="#e1ebf2"/>
  <rect x="674" y="102" width="290" height="44" rx="9" fill="#d9eee7"/>
  <text x="173" y="130" class="label" text-anchor="middle">Browser intent</text>
  <text x="492" y="130" class="label" text-anchor="middle">Asynchronous requests</text>
  <text x="819" y="130" class="label" text-anchor="middle">Credential / visible state</text>
  <path d="M173 158V437M492 158V437M819 158V437" class="rule"/>
  <rect x="55" y="165" width="236" height="57" rx="9" fill="white" stroke="#b9ccd9"/>
  <text x="73" y="188" class="label">Create session</text><text x="73" y="209" class="small muted">operation = 1</text>
  <path d="M291 194H470" stroke="#365168" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="321" y="180" class="small">exchange</text>
  <circle cx="492" cy="194" r="12" fill="#fff2d4" stroke="#a97110" stroke-width="2"/>
  <text x="515" y="200" class="small muted">reply delayed</text>
  <rect x="55" y="248" width="236" height="57" rx="9" fill="white" stroke="#b9ccd9"/>
  <text x="73" y="271" class="label">Revoke session</text><text x="73" y="292" class="small muted">operation = 2</text>
  <path d="M291 264H735" stroke="#08785f" stroke-width="2.5" marker-end="url(#green-arrow)"/>
  <rect x="751" y="246" width="179" height="37" rx="8" fill="#d9eee7"/>
  <text x="839" y="270" class="body" text-anchor="middle">token cleared now</text>
  <path d="M291 298H477" stroke="#365168" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="320" y="322" class="small muted">revoke still sent</text>
  <path d="M504 298H749" stroke="#08785f" stroke-width="2.5" marker-end="url(#green-arrow)"/>
  <text x="580" y="321" class="small muted">204 confirmed</text>
  <rect x="751" y="291" width="179" height="37" rx="8" fill="#d9eee7"/>
  <text x="839" y="315" class="body" text-anchor="middle">Session revoked</text>
  <path d="M492 207V376H719" fill="none" stroke="#a97110" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text x="520" y="363" class="small muted">old exchange finally replies</text>
  <rect x="737" y="350" width="207" height="77" rx="10" fill="#fff2d4" stroke="#d7b66f"/>
  <text x="754" y="376" class="label">Stale operation: 1 ≠ 2</text>
  <text x="754" y="399" class="body">Discard stale response</text>
  <text x="754" y="419" class="small muted">No token or UI overwrite</text>
  <rect x="36" y="463" width="928" height="78" rx="12" fill="#163349"/>
  <text x="57" y="492" font-size="18" font-weight="650" style="fill:white">Local proof: 14 scenarios × Chromium, Firefox and WebKit</text>
  <text x="57" y="518" class="small" style="fill:#d1e3ef">Original code fails the delayed-response test. Hosted 5 / 35-target qualification is a separate gate.</text>
</svg>
