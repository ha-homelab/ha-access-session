      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: sigstore/cosign
          ref: 11926fa5bbbbde47e88fc006b625a17769b743b2
          path: .release-cosign-source
          persist-credentials: false
