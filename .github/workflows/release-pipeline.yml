          echo "$RUNNER_TEMP/release-signer" >> "$GITHUB_PATH"
          echo "GODEBUG=fips140=on" >> "$GITHUB_ENV"
      - name: Download the plan used by every build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.prepare.outputs.plan_artifact }}
          path: .
