      build: ${{ steps.metadata.outputs.build }}
      status: ${{ steps.metadata.outputs.status }}
      plan_artifact: ${{ steps.metadata.outputs.plan_artifact }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache: false
      - name: Install the qualified GitHub CLI
        env:
          GODEBUG: fips140=on
        run: |
          python3 scripts/install_release_gh.py --output "$RUNNER_TEMP/release-gh/gh"
          echo "$RUNNER_TEMP/release-gh" >> "$GITHUB_PATH"
          echo "GODEBUG=fips140=on" >> "$GITHUB_ENV"
          echo "GH_HOST=github.com" >> "$GITHUB_ENV"
