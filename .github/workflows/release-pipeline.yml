# Generated by venus-os-ci-toolkit/scripts/install_release.py; edit .release-policy.json.
name: Release pipeline
run-name: "Release ${{ inputs.channel || github.event_name }} \xB7 ${{ github.sha }}"
'on':
  push:
    branches:
      - main
  schedule:
    - cron: 12 2 * * *
  workflow_dispatch:
    inputs:
      channel:
        type: choice
        description: Release channel
        options:
          - nightly
          - beta
          - rc
          - stable
        default: rc
        required: true
      version:
        type: string
        description: Base X.Y.Z (defaults to committed project version)
        required: false
      rc_tag:
        type: string
        description: 'For stable only: checked vX.Y.Z-rc.N'
        required: false
      expected_sha:
        type: string
        description: Optional exact default-branch SHA; the local CLI fills this to detect ref movement
        required: false
permissions:
  contents: read
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  scope:
    name: Change scope
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && (contains(fromJSON('["push","schedule","workflow_dispatch"]'),
      github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) && (vars.CI_RUNNER_RELEASE_LABELS
      || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    outputs:
      run: ${{ steps.scope.outputs.run }}
      reason: ${{ steps.scope.outputs.reason }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: scope
        name: Classify documentation and build inputs
        env:
          DOCUMENTATION_PATHS: '[]'
          REQUIRED_PATHS: '[]'
          FORCE_FULL: 'true'
        run: |
          args=()
          if [[ "$FORCE_FULL" == true ]]; then args+=(--force); fi
          python3 scripts/change_scope.py "${args[@]}" --documentation-paths-json "$DOCUMENTATION_PATHS" --required-paths-json "$REQUIRED_PATHS"
  prepare:
    needs: scope
    if: ${{ needs.scope.outputs.run == 'true' }}
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && (contains(fromJSON('["push","schedule","workflow_dispatch"]'),
      github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) && (vars.CI_RUNNER_RELEASE_LABELS
