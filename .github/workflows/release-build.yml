name: Build verified distribution
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      channel:
        type: string
        required: true
      release_plan_artifact:
        type: string
        required: true
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: '0.12.18'
          enable-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Install test and build dependencies
        run: |
          uv pip install --system -r requirements-dev.lock
          go mod download
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ inputs.release_plan_artifact }}
          path: .
      - name: Apply frozen release version
        run: python3 scripts/version_plan.py sync --root . --plan .release-plan.json
      - name: Build distribution
        run: sh scripts/build.sh
      - name: Bind artifacts to the verified release plan
        run: python3 scripts/stage_release_assets.py --target distribution --pattern 'dist/*.zip' --pattern 'dist/*.tar.gz'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-assets-distribution
          path: release-assets/distribution/*
          if-no-files-found: error
          retention-days: 30
