name: Offline contract tests
on:
  workflow_call:
permissions:
  contents: read
jobs:
  browser-compatibility:
    name: Session demo browser acceptance
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/typescript-ci.yml@5d5f3c5d94a3845e0906131348e55f4d221831e3
    permissions:
      contents: read
    with:
      node-version: '22'
      run-node-ci: false
      browser-matrix-file: .github/browser-compatibility.json
      browser-prepare-command: node --check gateway/web/app.js && node --check scripts/browser-acceptance.cjs
      browser-test-command: node scripts/browser-acceptance.cjs
      browser-extended: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.channel == '' || github.event.inputs.channel == 'rc')) }}
      browser-release-channel: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.channel || '' }}
  test:
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: '0.13.4'
          enable-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Install test and build dependencies
        run: |
          uv pip install --system -r requirements-dev.lock
          go mod download
      - name: Install isolated Home Assistant runtime
        run: |
          uv venv --python "$(command -v python3)" .ha-test
          uv pip install --python .ha-test/bin/python3 'homeassistant==2026.10.0'
      - name: Validate source and behavior
        env:
          HA_PYTHON: ${{ github.workspace }}/.ha-test/bin/python3
        run: |
          sh scripts/check.sh
      - name: Validate packaged Home Assistant integration
        run: |
          sh scripts/build.sh
          stage="$RUNNER_TEMP/ha-access-session-canary"
          mkdir -p "$stage"
          python3 -m zipfile -e "dist/ha-access-session-$(cat version).zip" "$stage"
          .ha-test/bin/python3 -I tests/real_ha_lifecycle.py --component-root "$stage"
