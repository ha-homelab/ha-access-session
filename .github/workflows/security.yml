name: Shared security checks
on:
  workflow_call:
permissions:
  contents: read
jobs:
  scan:
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/security-scan.yml@4c0b1565d4437315d1a8aadb4b2ab3e3fa350526 # main
    permissions:
      contents: read
      actions: read
      security-events: write
    with:
      languages: python,javascript,go
      run-codeql: true
      run-trivy: true
      run-dependency-review: true
