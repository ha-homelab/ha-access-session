name: Shared security checks
on:
  workflow_call:
permissions:
  contents: read
jobs:
  scan:
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/security-scan.yml@ece79d1b1ca40d3068d373e515daf58115489a22
    permissions:
      contents: read
      actions: read
      security-events: write
    with:
      languages: python,go
      run-codeql: true
      run-trivy: true
      run-dependency-review: true
