name: Shared security checks
on:
  workflow_call:
permissions:
  contents: read
jobs:
  scan:
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/security-scan.yml@644806e26446879b677f69a2f9eff58850e8c11a # main
    permissions:
      contents: read
      actions: read
      security-events: write
    with:
      languages: python,javascript,go
      run-codeql: true
      run-trivy: true
      run-dependency-review: true
