name: Shared security checks
on:
  workflow_call:
permissions:
  contents: read
jobs:
  scan:
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/security-scan.yml@4774181674f4a1a18488bfc918b4c5ed1df39163 # main
    permissions:
      contents: read
      actions: read
      security-events: write
    with:
      languages: python,javascript,go
      run-codeql: true
      run-trivy: true
      run-dependency-review: true
