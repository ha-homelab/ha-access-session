name: Shared security checks
on:
  workflow_call:
permissions:
  contents: read
jobs:
  scan:
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/security-scan.yml@486d9b959599bed009f9fdafb55f0820070ce860 # main
    permissions:
      contents: read
      actions: read
      security-events: write
    with:
      languages: python,javascript,go
      run-codeql: true
      run-trivy: true
      run-dependency-review: true
