name: Shared security checks
on:
  workflow_call:
permissions:
  contents: read
jobs:
  scan:
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/security-scan.yml@579fdb4f24e500bf601bc642422787c9be70684c # main
    permissions:
      contents: read
      actions: read
      security-events: write
    with:
      languages: python,javascript,go
      run-codeql: true
      run-trivy: true
      run-dependency-review: true
